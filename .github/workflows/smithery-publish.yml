name: Publish to Smithery

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  smithery-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build and Bundle code
        run: |
          npm run build
          npm run bundle

      # NEW STEP: Compress the compiled dist, package configuration, and smithery.yaml into a compliant bundle
      - name: Create lightweight .mcpb bundle
        run: |
          tar -czf twitter-mcp.mcpb dist/index.js smithery.yaml package.json
          ls -lh twitter-mcp.mcpb

      - name: Install Smithery CLI
        run: npm install -g smithery@latest

      # FIXED: Pass the explicitly generated bundle target instead of the directory dot
      - name: Publish to Smithery Registry
        run: |
          smithery mcp publish ./twitter-mcp.mcpb -n muhammadsiddiq/twitter-mcp
        env:
          SMITHERY_API_KEY: ${{ secrets.SMITHERY_TOKEN }}