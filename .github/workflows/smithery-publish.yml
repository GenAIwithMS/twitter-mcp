name: Publish to Smithery

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  smithery-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install All Dependencies
        run: npm install

      - name: Compile TypeScript and Build Bundle
        run: |
          npm run build
          npm run bundle

      # FIXED: Using zip command (-r for recursive tracking) to create a valid zip archive structure
      - name: Create Comprehensive .mcpb bundle
        run: |
          zip -r twitter-mcp.mcpb dist/ package.json smithery.yaml README.md
          ls -lh twitter-mcp.mcpb

      - name: Install Smithery CLI
        run: npm install -g smithery@latest

      - name: Publish to Smithery Registry
        run: |
          smithery mcp publish ./twitter-mcp.mcpb -n muhammadsiddiq/twitter-mcp
        env:
          SMITHERY_API_KEY: ${{ secrets.SMITHERY_TOKEN }}