name: Publish to Smithery

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  smithery-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build and Bundle code
        run: |
          npm run build
          npm run bundle

      - name: Install Smithery CLI
        run: npm install -g smithery@latest

      - name: Publish to Smithery Registry
        run: |
          smithery mcp publish . -n muhammadsiddiq/twitter-mcp
        env:
          SMITHERY_API_KEY: ${{ secrets.SMITHERY_TOKEN }}